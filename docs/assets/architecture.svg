<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="cubrid-sqlancer architecture: upstream SQLancer discovers this repo's provider through ServiceLoader, the provider drives an isolated CUBRID home, and every run leaves session logs and crash stacks as evidence">
<style>
  .ttl{font-size:15px;font-weight:700;fill:#1f2937}
  .sub{font-size:11px;fill:#6b7280}
  .band{font-size:9px;font-weight:700;fill:#9ca3af;letter-spacing:1.1px}
  .h{font-size:11.5px;font-weight:700;fill:#1f2937}
  .d{font-size:9.5px;fill:#6b7280}
  .m{font-size:9px;fill:#2563eb;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
  .boxp{fill:#eff6ff;stroke:#2563eb;stroke-width:1.4}
  .boxn{fill:#f0fdf4;stroke:#1a7f37;stroke-width:1.4}
  .hdbox{fill:#eef2f7;stroke:#d1d5db;stroke-width:1}
  .arw{stroke:#6b7280;stroke-width:1.4;fill:none;marker-end:url(#a)}
  .note{font-size:9px;fill:#9ca3af}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect x="0" y="0" width="880" height="620" fill="#ffffff"/>

<text class="ttl" x="30" y="30">cubrid-sqlancer — how the pieces fit</text>
<text class="sub" x="30" y="48">Upstream stays unmodified. This repo is a jar on the classpath, found through ServiceLoader.</text>

<!-- Band A: upstream -->
<text class="band" x="30" y="76">UPSTREAM — sqlancer/sqlancer, built from source, not forked</text>
<rect class="hdbox" x="30" y="84" width="626" height="96" rx="6"/>
<rect class="box" x="44" y="100" width="180" height="64" rx="5"/>
<text class="h" x="56" y="120">sqlancer.Main</text>
<text class="d" x="56" y="136">discovers providers via</text>
<text class="m" x="56" y="150">ServiceLoader.load(...)</text>
<rect class="box" x="238" y="100" width="180" height="64" rx="5"/>
<text class="h" x="250" y="120">NoRECOracle</text>
<text class="d" x="250" y="136">compares the two counts,</text>
<text class="d" x="250" y="150">raises on mismatch</text>
<rect class="box" x="432" y="100" width="210" height="64" rx="5"/>
<text class="h" x="444" y="120">StatementExecutor · Randomly</text>
<text class="d" x="444" y="136">drives DDL/DML actions and</text>
<text class="d" x="444" y="150">the random value pool</text>

<path class="arw" d="M343 182 L343 214"/>
<text class="note" x="352" y="202">META-INF/services/sqlancer.DatabaseProvider  ·  generated by @AutoService</text>

<!-- Band B: this repo -->
<text class="band" x="30" y="238">THIS REPO — package sqlancer.cubrid</text>
<rect class="boxp" x="30" y="246" width="626" height="146" rx="6"/>
<rect class="box" x="44" y="262" width="180" height="56" rx="5"/>
<text class="h" x="56" y="281">CUBRIDProvider</text>
<text class="d" x="56" y="296">connects, drops user tables</text>
<text class="d" x="56" y="309">(CUBRID has no CREATE DATABASE)</text>
<rect class="box" x="238" y="262" width="180" height="56" rx="5"/>
<text class="h" x="250" y="281">CUBRIDSchema</text>
<text class="d" x="250" y="296">db_class · db_attribute,</text>
<text class="d" x="250" y="309">ordered by def_order</text>
<rect class="box" x="432" y="262" width="210" height="56" rx="5"/>
<text class="h" x="444" y="281">CUBRIDErrors</text>
<text class="d" x="444" y="296">errors that are expected,</text>
<text class="d" x="444" y="309">not bugs</text>
<rect class="box" x="44" y="330" width="374" height="48" rx="5"/>
<text class="h" x="56" y="349">gen/CUBRIDExpressionGenerator</text>
<text class="d" x="56" y="365">implements NoRECGenerator — builds both query strings</text>
<rect class="box" x="432" y="330" width="210" height="48" rx="5"/>
<text class="h" x="444" y="349">ast/ · CUBRIDToStringVisitor</text>
<text class="d" x="444" y="365">CUBRID syntax, CUBRID literals</text>

<path class="arw" d="M343 394 L343 426"/>
<text class="note" x="352" y="414">JDBC  ·  jdbc:CUBRID:host:port:db:user:password:</text>

<!-- Band C: SUT -->
<text class="band" x="30" y="450">SYSTEM UNDER TEST — an isolated CUBRID_HOME, never the shared one</text>
<rect class="boxn" x="30" y="458" width="626" height="86" rx="6"/>
<rect class="box" x="44" y="474" width="180" height="54" rx="5"/>
<text class="h" x="56" y="493">cub_master</text>
<text class="m" x="56" y="508">port 1723</text>
<text class="d" x="56" y="521">core limit inherited by children</text>
<rect class="box" x="238" y="474" width="180" height="54" rx="5"/>
<text class="h" x="250" y="493">broker1</text>
<text class="m" x="250" y="508">port 34001</text>
<text class="d" x="250" y="521">shm 34001 · master shm 34099</text>
<rect class="box" x="432" y="474" width="210" height="54" rx="5"/>
<text class="h" x="444" y="493">cub_server sqlancer</text>
<text class="d" x="444" y="508">one prepared database,</text>
<text class="d" x="444" y="521">tables recreated per iteration</text>

<!-- Right rail: scripts -->
<text class="band" x="676" y="76">SCRIPTS</text>
<rect class="hdbox" x="676" y="84" width="174" height="460" rx="6"/>
<rect class="box" x="688" y="100" width="150" height="76" rx="5"/>
<text class="h" x="698" y="119">bootstrap.sh</text>
<text class="d" x="698" y="134">builds SQLancer from</text>
<text class="d" x="698" y="147">source (Central is from</text>
<text class="d" x="698" y="160">2022) and installs the</text>
<text class="d" x="698" y="171">CUBRID JDBC jar</text>
<rect class="box" x="688" y="190" width="150" height="76" rx="5"/>
<text class="h" x="698" y="209">cubrid-env.sh</text>
<text class="d" x="698" y="224">a thin CUBRID_HOME:</text>
<text class="d" x="698" y="237">bin and lib symlinked,</text>
<text class="d" x="698" y="250">conf log var databases</text>
<text class="d" x="698" y="261">of its own</text>
<rect class="box" x="688" y="280" width="150" height="76" rx="5"/>
<text class="h" x="698" y="299">cubrid-testdb.sh</text>
<text class="d" x="698" y="314">create · reuse · recreate</text>
<text class="d" x="698" y="327">the test database, and</text>
<text class="d" x="698" y="340">decide whether a crash</text>
<text class="d" x="698" y="351">may write a 20 GB core</text>
<rect class="box" x="688" y="370" width="150" height="76" rx="5"/>
<text class="h" x="698" y="389">crash-repro.sh</text>
<text class="d" x="698" y="404">replays a session log,</text>
<text class="d" x="698" y="417">then reduces it to the</text>
<text class="d" x="698" y="430">shortest sequence that</text>
<text class="d" x="698" y="441">still kills the server</text>

<!-- Band D: evidence -->
<text class="band" x="30" y="576">WHAT A RUN LEAVES BEHIND</text>
<rect class="box" x="30" y="584" width="266" height="26" rx="5"/>
<text class="m" x="42" y="601">logs/cubrid/databaseN-cur.log</text>
<rect class="box" x="308" y="584" width="266" height="26" rx="5"/>
<text class="m" x="320" y="601">$CUBRID/log/coredump/*.coredump</text>
<rect class="box" x="586" y="584" width="264" height="26" rx="5"/>
<text class="d" x="598" y="601">a mismatch: two counts that should have agreed</text>
</svg>
